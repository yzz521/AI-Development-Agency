# Agency 增量门禁开关（可提交）。未列出的项用 checks/catalog.tsv 的 default。
# 语法：<check-id>=on|off
#        base=<git-ref>     CI 对比点，可被 --base 覆盖
#
# 默认已开：java-map-object / sql-select-star / secret-hardcoded
# 默认关闭且不要当中央默认开：java-pathvariable、sql-limit、sql-backtick、
# java-fqcn、java-requestbody-valid、java-sensitive-log
# Javert 专有（一律 POST、ylzzjgdm）不要写进中央 catalog。

base=origin/main

# java-map-object=on
# sql-select-star=on
# secret-hardcoded=on
# java-pathvariable=off
# sql-limit=off
# sql-backtick=off
# java-fqcn=off
# java-requestbody-valid=off
# java-sensitive-log=off
